<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-image: url("./img/palco-catedral.png");
      }
    </style>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <section>
        <h1 id="titulo">Summer Beats Festival</h1>
        <h4 id="sub-titulo">"O ritmo que move uma geração"</h4>
      </section>
    </header>
    <section>
      <div id="menu">
        <h4>MENU DE NAVEGAÇÃO</h4>
        <button>
          <a href="index.html"> <p>Home</p> </a>
        </button>
        <button>
          <a href="pagina2.html"><p>Informações</p> </a>
        </button>
        <button>
          <a href="pagina3.html"><p>Sobre</p></a>
        </button>
        <button>
          <a href="contato.html"><p>Contato</p></a>
        </button>
      </div>
    </section>

    <main>
      <section class="formulario">
        <h2>Campos de formulário</h2>
        <form>
          <p>
            <label for="nome">Nome: </label><br />
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome"
            />
          </p>

          <p>
            <label for="email">E-mail: </label><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite um e-mail"
            />
          </p>

          <p>
            <label for="assunto">Assunto:</label><br />
            <input
              type="text"
              id="assunto"
              name="assunto"
              placeholder="Digite o assunto"
            />
          </p>
          <p>
            <label for="mensagem">Mensagem:</label><br />
            <textarea
              id="mensagem"
              name="mensagem"
              rows="5"
              placeholder="Digite sua mensagem"
            ></textarea>
          </p>
          <button >Enviar</button>
        </form>

      </section>
    </main>

    <div class="bloco">
      <footer id="final">
        <li>contato.evento@email.com</li>
        <li>(22)98413-2555</li>
        <li>2026</li>
        <li>Todos os direitos reservados &copy;</li>
      </footer>
    </div>
  </body>
</html>
